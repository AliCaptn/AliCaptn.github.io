<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Sample SQL reporting query"><rect width="800" height="500" fill="#0E1930"/><rect width="800" height="46" fill="#121F3C"/><rect x="16" y="15" width="4" height="16" rx="2" fill="#1769D2"/><rect x="23" y="11" width="4" height="20" rx="2" fill="#16B8C4"/><rect x="30" y="18" width="4" height="13" rx="2" fill="#1769D2"/><text x="46" y="24" font-size="14" fill="#fff" font-weight="800" font-family="Inter,Segoe UI,sans-serif">SQL Reporting</text><text x="46" y="37" font-size="9.5" fill="#9FB0CE" font-family="Inter,Segoe UI,sans-serif">Query and results</text><rect x="556" y="13" width="76" height="20" rx="10" fill="#1B2C55"/><text x="594" y="27" font-size="9.5" fill="#DCE5F2" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif">SQL Server</text><rect x="662" y="13" width="122" height="20" rx="10" fill="none" fill-opacity="0" stroke="#16B8C4"/><text x="723" y="27" font-size="9.5" fill="#16B8C4" font-weight="600" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif">Sample data</text><rect x="16" y="58" width="768" height="200" rx="10" fill="#16254A" fill-opacity="1" stroke="rgba(255,255,255,.08)"/><text x="30" y="80" font-size="11" fill="#9FB0CE" font-weight="600" font-family="Inter,Segoe UI,sans-serif">Query</text><text x="44" y="98" font-size="10" fill="#2A3D6B" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><text x="58" y="98" font-size="11.5" font-family="ui-monospace,Menlo,Consolas,monospace"><tspan fill="#16B8C4">SELECT </tspan><tspan fill="#fff">d.month_name,</tspan></text><text x="44" y="115" font-size="10" fill="#2A3D6B" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><text x="58" y="115" font-size="11.5" font-family="ui-monospace,Menlo,Consolas,monospace"><tspan fill="#fff">       r.region,</tspan></text><text x="44" y="132" font-size="10" fill="#2A3D6B" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">3</text><text x="58" y="132" font-size="11.5" font-family="ui-monospace,Menlo,Consolas,monospace"><tspan fill="#16B8C4">       SUM</tspan><tspan fill="#fff">(f.net_amount) </tspan><tspan fill="#16B8C4">AS </tspan><tspan fill="#fff">revenue</tspan></text><text x="44" y="149" font-size="10" fill="#2A3D6B" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">4</text><text x="58" y="149" font-size="11.5" font-family="ui-monospace,Menlo,Consolas,monospace"><tspan fill="#16B8C4">FROM   </tspan><tspan fill="#fff">fact_sales f</tspan></text><text x="44" y="166" font-size="10" fill="#2A3D6B" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">5</text><text x="58" y="166" font-size="11.5" font-family="ui-monospace,Menlo,Consolas,monospace"><tspan fill="#16B8C4">JOIN   </tspan><tspan fill="#fff">dim_date d </tspan><tspan fill="#16B8C4">ON </tspan><tspan fill="#fff">d.date_key = f.date_key</tspan></text><text x="44" y="183" font-size="10" fill="#2A3D6B" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">6</text><text x="58" y="183" font-size="11.5" font-family="ui-monospace,Menlo,Consolas,monospace"><tspan fill="#16B8C4">JOIN   </tspan><tspan fill="#fff">dim_region r </tspan><tspan fill="#16B8C4">ON </tspan><tspan fill="#fff">r.region_key = f.region_key</tspan></text><text x="44" y="200" font-size="10" fill="#2A3D6B" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">7</text><text x="58" y="200" font-size="11.5" font-family="ui-monospace,Menlo,Consolas,monospace"><tspan fill="#16B8C4">WHERE  </tspan><tspan fill="#fff">d.year = </tspan><tspan fill="#F2A65A">2025</tspan></text><text x="44" y="217" font-size="10" fill="#2A3D6B" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">8</text><text x="58" y="217" font-size="11.5" font-family="ui-monospace,Menlo,Consolas,monospace"><tspan fill="#16B8C4">GROUP  BY </tspan><tspan fill="#fff">d.month_name, r.region</tspan></text><text x="44" y="234" font-size="10" fill="#2A3D6B" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">9</text><text x="58" y="234" font-size="11.5" font-family="ui-monospace,Menlo,Consolas,monospace"><tspan fill="#16B8C4">ORDER  BY </tspan><tspan fill="#fff">revenue </tspan><tspan fill="#16B8C4">DESC</tspan><tspan fill="#fff">;</tspan></text><text x="44" y="251" font-size="10" fill="#2A3D6B" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">10</text><text x="58" y="251" font-size="11.5" font-family="ui-monospace,Menlo,Consolas,monospace"><tspan fill="#9FB0CE">-- sample query, illustrative schema</tspan></text><rect x="16" y="270" width="768" height="218" rx="10" fill="#16254A" fill-opacity="1" stroke="rgba(255,255,255,.08)"/><text x="30" y="292" font-size="11" fill="#9FB0CE" font-weight="600" font-family="Inter,Segoe UI,sans-serif">Results</text><text x="768" y="292" font-size="9.5" fill="#16B8C4" font-weight="600" text-anchor="end" font-family="Inter,Segoe UI,sans-serif">8 rows returned</text><text x="32" y="322" font-size="9.5" fill="#9FB0CE" font-weight="600" font-family="Inter,Segoe UI,sans-serif">month_name</text><text x="232" y="322" font-size="9.5" fill="#9FB0CE" font-weight="600" font-family="Inter,Segoe UI,sans-serif">region</text><text x="768" y="322" font-size="9.5" fill="#9FB0CE" font-weight="600" text-anchor="end" font-family="Inter,Segoe UI,sans-serif">revenue</text><line x1="32" x2="768" y1="330" y2="330" stroke="#fff" stroke-opacity=".08"/><text x="32" y="347" font-size="10.5" fill="#fff" font-family="Inter,Segoe UI,sans-serif">December</text><text x="232" y="347" font-size="10.5" fill="#DCE5F2" font-family="Inter,Segoe UI,sans-serif">North America</text><text x="768" y="347" font-size="10.5" fill="#DCE5F2" text-anchor="end" font-family="Inter,Segoe UI,sans-serif">$162,400</text><line x1="32" x2="768" y1="354" y2="354" stroke="#fff" stroke-opacity=".08"/><text x="32" y="371" font-size="10.5" fill="#fff" font-family="Inter,Segoe UI,sans-serif">December</text><text x="232" y="371" font-size="10.5" fill="#DCE5F2" font-family="Inter,Segoe UI,sans-serif">Europe</text><text x="768" y="371" font-size="10.5" fill="#DCE5F2" text-anchor="end" font-family="Inter,Segoe UI,sans-serif">$131,900</text><line x1="32" x2="768" y1="378" y2="378" stroke="#fff" stroke-opacity=".08"/><text x="32" y="395" font-size="10.5" fill="#fff" font-family="Inter,Segoe UI,sans-serif">November</text><text x="232" y="395" font-size="10.5" fill="#DCE5F2" font-family="Inter,Segoe UI,sans-serif">North America</text><text x="768" y="395" font-size="10.5" fill="#DCE5F2" text-anchor="end" font-family="Inter,Segoe UI,sans-serif">$148,200</text><line x1="32" x2="768" y1="402" y2="402" stroke="#fff" stroke-opacity=".08"/><text x="32" y="419" font-size="10.5" fill="#fff" font-family="Inter,Segoe UI,sans-serif">November</text><text x="232" y="419" font-size="10.5" fill="#DCE5F2" font-family="Inter,Segoe UI,sans-serif">Europe</text><text x="768" y="419" font-size="10.5" fill="#DCE5F2" text-anchor="end" font-family="Inter,Segoe UI,sans-serif">$124,700</text><line x1="32" x2="768" y1="426" y2="426" stroke="#fff" stroke-opacity=".08"/><text x="32" y="443" font-size="10.5" fill="#fff" font-family="Inter,Segoe UI,sans-serif">October</text><text x="232" y="443" font-size="10.5" fill="#DCE5F2" font-family="Inter,Segoe UI,sans-serif">North America</text><text x="768" y="443" font-size="10.5" fill="#DCE5F2" text-anchor="end" font-family="Inter,Segoe UI,sans-serif">$139,800</text><line x1="32" x2="768" y1="450" y2="450" stroke="#fff" stroke-opacity=".08"/><text x="32" y="467" font-size="10.5" fill="#fff" font-family="Inter,Segoe UI,sans-serif">October</text><text x="232" y="467" font-size="10.5" fill="#DCE5F2" font-family="Inter,Segoe UI,sans-serif">Asia Pacific</text><text x="768" y="467" font-size="10.5" fill="#DCE5F2" text-anchor="end" font-family="Inter,Segoe UI,sans-serif">$112,300</text></svg>
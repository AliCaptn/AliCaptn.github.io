e_key</text><text x="483" y="227" font-size="8.5" fill="#16B8C4" font-weight="700" text-anchor="end" font-family="Inter,Segoe UI,sans-serif">FK</text><text x="317" y="245" font-size="10" fill="#9FB0CE" font-weight="400" font-family="Inter,Segoe UI,sans-serif">amount</text><rect x="530" y="70" width="254" height="190" rx="10" fill="#16254A" fill-opacity="1" stroke="rgba(255,255,255,.08)"/><text x="544" y="92" font-size="11" fill="#9FB0CE" font-weight="600" font-family="Inter,Segoe UI,sans-serif">One date table, three roles</text><text x="544" y="118" font-size="10.5" fill="#DCE5F2" font-family="Inter,Segoe UI,sans-serif">The same calendar answers</text><text x="544" y="136" font-size="10.5" fill="#DCE5F2" font-family="Inter,Segoe UI,sans-serif">three questions: when it was</text><text x="544" y="154" font-size="10.5" fill="#DCE5F2" font-family="Inter,Segoe UI,sans-serif">ordered, shipped and due.</text><text x="544" y="172" font-size="10.5" fill="#DCE5F2" font-family="Inter,Segoe UI,sans-serif"></text><text x="544" y="190" font-size="10.5" fill="#DCE5F2" font-family="Inter,Segoe UI,sans-serif">One relationship is active.</text><text x="544" y="208" font-size="10.5" fill="#DCE5F2" font-family="Inter,Segoe UI,sans-serif">The others are switched on</text><text x="544" y="226" font-size="10.5" fill="#DCE5F2" font-family="Inter,Segoe UI,sans-serif">inside a measure.</text><rect x="40" y="290" width="744" height="198" rx="10" fill="#16254A" fill-opacity="1" stroke="rgba(255,255,255,.08)"/><text x="54" y="312" font-size="11" fill="#9FB0CE" font-weight="600" font-family="Inter,Segoe UI,sans-serif">Use an inactive relationship in a measure</text><text x="70" y="334" font-size="10" fill="#2A3D6B" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><text x="84" y="334" font-size="11.5" font-family="ui-monospace,Menlo,Consolas,monospace"><tspan fill="#fff">Revenue by Ship Date =</tspan></text><text x="70" y="360" font-size="10" fill="#2A3D6B" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><text x="84" y="360" font-size="11.5" font-family="ui-monospace,Menlo,Consolas,monospace"><tspan fill="#16B8C4">CALCULATE</tspan><tspan fill="#fff">(</tspan></text><text x="70" y="386" font-size="10" fill="#2A3D6B" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">3</text><text x="84" y="386" font-size="11.5" font-family="ui-monospace,Menlo,Consolas,monospace"><tspan fill="#fff">    </tspan><tspan fill="#F2A65A">[Total Revenue]</tspan><tspan fill="#fff">,</tspan></text><text x="70" y="412" font-size="10" fill="#2A3D6B" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">4</text><text x="84" y="412" font-size="11.5" font-family="ui-monospace,Menlo,Consolas,monospace"><tspan fill="#fff">    </tspan><tspan fill="#16B8C4">USERELATIONSHIP</tspan><tspan fill="#7FB4F2">( fact_orders[ship_date_key], dim_date[date_key] )</tspan></text><text x="70" y="438" font-size="10" fill="#2A3D6B" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">5</text><text x="84" y="438" font-size="11.5" font-family="ui-monospace,Menlo,Consolas,monospace"><tspan fill="#fff">)</tspan></text></svg>
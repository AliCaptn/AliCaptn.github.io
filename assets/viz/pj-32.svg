<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 500" role="img" aria-label="Sample calendar table data model"><rect width="800" height="500" fill="#0E1930"/><rect width="800" height="46" fill="#121F3C"/><rect x="16" y="15" width="4" height="16" rx="2" fill="#1769D2"/><rect x="23" y="11" width="4" height="20" rx="2" fill="#16B8C4"/><rect x="30" y="18" width="4" height="13" rx="2" fill="#1769D2"/><text x="46" y="24" font-size="14" fill="#fff" font-weight="800" font-family="Inter,Segoe UI,sans-serif">Semantic Model</text><text x="46" y="37" font-size="9.5" fill="#9FB0CE" font-family="Inter,Segoe UI,sans-serif">Calendar table · time intelligence</text><rect x="550.2" y="13" width="81.8" height="20" rx="10" fill="#1B2C55"/><text x="591.1" y="27" font-size="9.5" fill="#DCE5F2" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif">Import mode</text><rect x="662" y="13" width="122" height="20" rx="10" fill="none" fill-opacity="0" stroke="#16B8C4"/><text x="723" y="27" font-size="9.5" fill="#16B8C4" font-weight="600" text-anchor="middle" font-family="Inter,Segoe UI,sans-serif">Sample data</text><path d="M270 207H330" fill="none" stroke="#16B8C4" stroke-width="1.6"/><text x="277" y="201" font-size="11" fill="#16B8C4" font-weight="700" text-anchor="start" font-family="Inter,Segoe UI,sans-serif">1</text><text x="323" y="201" font-size="11" fill="#16B8C4" font-weight="700" text-anchor="end" font-family="Inter,Segoe UI,sans-serif">*</text><rect x="40" y="64" width="230" height="230" rx="8" fill="#16254A" fill-opacity="1" stroke="rgba(255,255,255,.12)"/><path d="M40 90V72a8 8 0 0 1 8-8h214a8 8 0 0 1 8 8V90z" fill="#2A3D6B"/><text x="52" y="81" font-size="11.5" fill="#fff" font-weight="700" font-family="Inter,Segoe UI,sans-serif">dim_date</text><text x="52" y="107" font-size="10" fill="#fff" font-weight="700" font-family="Inter,Segoe UI,sans-serif">date_key</text><text x="258" y="107" font-size="8.5" fill="#16B8C4" font-weight="700" text-anchor="end" font-family="Inter,Segoe UI,sans-serif">PK</text><text x="52" y="125" font-size="10" fill="#9FB0CE" font-weight="400" font-family="Inter,Segoe UI,sans-serif">date</text><text x="52" y="143" font-size="10" fill="#9FB0CE" font-weight="400" font-family="Inter,Segoe UI,sans-serif">year</text><text x="52" y="161" font-size="10" fill="#9FB0CE" font-weight="400" font-family="Inter,Segoe UI,sans-serif">quarter</text><text x="52" y="179" font-size="10" fill="#9FB0CE" font-weight="400" font-family="Inter,Segoe UI,sans-serif">month_no</text><text x="52" y="197" font-size="10" fill="#9FB0CE" font-weight="400" font-family="Inter,Segoe UI,sans-serif">month_name</text><text x="52" y="215" font-size="10" fill="#9FB0CE" font-weight="400" font-family="Inter,Segoe UI,sans-serif">week_no</text><text x="52" y="233" font-size="10" fill="#9FB0CE" font-weight="400" font-family="Inter,Segoe UI,sans-serif">day_name</text><text x="52" y="251" font-size="10" fill="#9FB0CE" font-weight="400" font-family="Inter,Segoe UI,sans-serif">is_weekend</text><text x="52" y="269" font-size="10" fill="#9FB0CE" font-weight="400" font-family="Inter,Segoe UI,sans-serif">fiscal_year</text><text x="52" y="287" font-size="10" fill="#9FB0CE" font-weight="400" font-family="Inter,Segoe UI,sans-serif">fiscal_period</text><rect x="330" y="150" width="190" height="104" rx="8" fill="#16254A" fill-opacity="1" stroke="rgba(255,255,255,.12)"/><path d="M330 176V158a8 8 0 0 1 8-8h174a8 8 0 0 1 8 8V176z" fill="#1769D2"/><text x="342" y="167" font-size="11.5" fill="#fff" font-weight="700" font-family="Inter,Segoe UI,sans-serif">fact_sales</text><text x="342" y="193" font-size="10" fill="#fff" font-weight="700" font-family="Inter,Segoe UI,sans-serif">sales_key</text><text x="508" y="193" font-size="8.5" fill="#16B8C4" font-weight="700" text-anchor="end" font-family="Inter,Segoe UI,sans-serif">PK</text><text x="342" y="211" font-size="10" fill="#fff" font-weight="700" font-family="Inter,Segoe UI,sans-serif">date_key</text><text x="508" y="211" font-size="8.5" fill="#16B8C4" font-weight="700" text-anchor="end" font-family="Inter,Segoe UI,sans-serif">FK</text><text x="342" y="229" font-size="10" fill="#fff" font-weight="700" font-family="Inter,Segoe UI,sans-serif">product_key</text><text x="508" y="229" font-size="8.5" fill="#16B8C4" font-weight="700" text-anchor="end" font-family="Inter,Segoe UI,sans-serif">FK</text><text x="342" y="247" font-size="10" fill="#9FB0CE" font-weight="400" font-family="Inter,Segoe UI,sans-serif">net_amount</text><rect x="550" y="64" width="234" height="190" rx="10" fill="#16254A" fill-opacity="1" stroke="rgba(255,255,255,.08)"/><text x="564" y="86" font-size="11" fill="#9FB0CE" font-weight="600" font-family="Inter,Segoe UI,sans-serif">Marked as the date table</text><text x="564" y="112" font-size="10.5" fill="#DCE5F2" font-family="Inter,Segoe UI,sans-serif">One row per day, no gaps.</text><text x="564" y="130" font-size="10.5" fill="#DCE5F2" font-family="Inter,Segoe UI,sans-serif">Marked as the date table so</text><text x="564" y="148" font-size="10.5" fill="#DCE5F2" font-family="Inter,Segoe UI,sans-serif">time intelligence works.</text><text x="564" y="166" font-size="10.5" fill="#DCE5F2" font-family="Inter,Segoe UI,sans-serif">Fiscal columns follow the</text><text x="564" y="184" font-size="10.5" fill="#DCE5F2" font-family="Inter,Segoe UI,sans-serif">company calendar.</text><rect x="40" y="310" width="744" height="178" rx="10" fill="#16254A" fill-opacity="1" stroke="rgba(255,255,255,.08)"/><text x="54" y="332" font-size="11" fill="#9FB0CE" font-weight="600" font-family="Inter,Segoe UI,sans-serif">Measures that rely on the date table</text><text x="70" y="354" font-size="10" fill="#2A3D6B" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">1</text><text x="84" y="354" font-size="11.5" font-family="ui-monospace,Menlo,Consolas,monospace"><tspan fill="#fff">Revenue YTD = </tspan><tspan fill="#16B8C4">TOTALYTD</tspan><tspan fill="#fff">( </tspan><tspan fill="#F2A65A">[Total Revenue]</tspan><tspan fill="#fff">, dim_date[date] )</tspan></text><text x="70" y="378" font-size="10" fill="#2A3D6B" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">2</text><text x="84" y="378" font-size="11.5" font-family="ui-monospace,Menlo,Consolas,monospace"><tspan fill="#fff">Revenue PY = </tspan><tspan fill="#16B8C4">CALCULATE</tspan><tspan fill="#fff">( </tspan><tspan fill="#F2A65A">[Total Revenue]</tspan><tspan fill="#fff">, </tspan><tspan fill="#16B8C4">SAMEPERIODLASTYEAR</tspan><tspan fill="#fff">( dim_date[date] ) )</tspan></text><text x="70" y="402" font-size="10" fill="#2A3D6B" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">3</text><text x="84" y="402" font-size="11.5" font-family="ui-monospace,Menlo,Consolas,monospace"><tspan fill="#fff">Revenue 3M = </tspan><tspan fill="#16B8C4">CALCULATE</tspan><tspan fill="#fff">( </tspan><tspan fill="#F2A65A">[Total Revenue]</tspan><tspan fill="#fff">,</tspan></text><text x="70" y="426" font-size="10" fill="#2A3D6B" text-anchor="end" font-family="ui-monospace,Menlo,Consolas,monospace">4</text><text x="84" y="426" font-size="11.5" font-family="ui-monospace,Menlo,Consolas,monospace"><tspan fill="#fff">    </tspan><tspan fill="#16B8C4">DATESINPERIOD</tspan><tspan fill="#fff">( dim_date[date], MAX( dim_date[date] ), -3, MONTH ) )</tspan></text></svg>
<text x="543" y="144" font-size="11" fill="#16B8C4" font-weight="700" text-anchor="start" font-family="Inter,Segoe UI,sans-serif">1</text><text x="583" y="144" font-size="11" fill="#16B8C4" font-weight="700" text-anchor="end" font-family="Inter,Segoe UI,sans-serif">*</text><rect x="590" y="100" width="190" height="104" rx="8" fill="#16254A" fill-opacity="1" stroke="rgba(255,255,255,.12)"/><path d="M590 126V108a8 8 0 0 1 8-8h174a8 8 0 0 1 8 8V126z" fill="#1769D2"/><text x="602" y="117" font-size="11.5" fill="#fff" font-weight="700" font-family="Inter,Segoe UI,sans-serif">fact_sales</text><text x="602" y="143" font-size="10" fill="#fff" font-weight="700" font-family="Inter,Segoe UI,sans-serif">sales_key</text><text x="768" y="143" font-size="8.5" fill="#16B8C4" font-weight="700" text-anchor="end" font-family="Inter,Segoe UI,sans-serif">PK</text><text x="602" y="161" font-size="10" fill="#fff" font-weight="700" font-family="Inter,Segoe UI,sans-serif">customer_key</text><text x="768" y="161" font-size="8.5" fill="#16B8C4" font-weight="700" text-anchor="end" font-family="Inter,Segoe UI,sans-serif">FK</text><text x="602" y="179" font-size="10" fill="#fff" font-weight="700" font-family="Inter,Segoe UI,sans-serif">date_key</text><text x="768" y="179" font-size="8.5" fill="#16B8C4" font-weight="700" text-anchor="end" font-family="Inter,Segoe UI,sans-serif">FK</text><text x="602" y="197" font-size="10" fill="#9FB0CE" font-weight="400" font-family="Inter,Segoe UI,sans-serif">net_amount</text><rect x="16" y="322" width="768" height="166" rx="10" fill="#16254A" fill-opacity="1" stroke="rgba(255,255,255,.08)"/><text x="30" y="344" font-size="11" fill="#9FB0CE" font-weight="600" font-family="Inter,Segoe UI,sans-serif">How it works</text><text x="30" y="370" font-size="10.5" fill="#DCE5F2" font-family="Inter,Segoe UI,sans-serif">Each change creates a new row with its own surrogate key.</text><text x="30" y="388" font-size="10.5" fill="#DCE5F2" font-family="Inter,Segoe UI,sans-serif">Facts keep pointing at the version that was true on the transaction date.</text><text x="30" y="406" font-size="10.5" fill="#DCE5F2" font-family="Inter,Segoe UI,sans-serif">valid_from and valid_to show when each version applied; the current flag marks the latest.</text><text x="30" y="424" font-size="10.5" fill="#DCE5F2" font-family="Inter,Segoe UI,sans-serif">Reports can show history as it was, or roll everything up to the current version.</text></svg>
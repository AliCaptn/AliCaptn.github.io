if">region_key</text><text x="748" y="127" font-size="8.5" fill="#16B8C4" font-weight="700" text-anchor="end" font-family="Inter,Segoe UI,sans-serif">FK</text><text x="582" y="145" font-size="10" fill="#9FB0CE" font-weight="400" font-family="Inter,Segoe UI,sans-serif">net_amount</text><rect x="16" y="200" width="240" height="130" rx="10" fill="#16254A" fill-opacity="1" stroke="rgba(255,255,255,.08)"/><text x="30" y="222" font-size="11" fill="#9FB0CE" font-weight="600" font-family="Inter,Segoe UI,sans-serif">Role: Regional Manager</text><text x="30" y="244" font-size="10.5" fill="#DCE5F2" font-family="Inter,Segoe UI,sans-serif">Sees only the regions</text><text x="30" y="262" font-size="10.5" fill="#DCE5F2" font-family="Inter,Segoe UI,sans-serif">assigned to their sign-in.</text><rect x="30" y="282" width="212" height="30" rx="6" fill="#1B2C55"/><text x="40" y="301" font-size="9.5" fill="#16B8C4" font-weight="600" font-family="Inter,Segoe UI,sans-serif">[user_email] = USERPRINCIPALNAME()</text><rect x="280" y="200" width="240" height="130" rx="10" fill="#16254A" fill-opacity="1" stroke="rgba(255,255,255,.08)"/><text x="294" y="222" font-size="11" fill="#9FB0CE" font-weight="600" font-family="Inter,Segoe UI,sans-serif">Role: Executive</text><text x="294" y="244" font-size="10.5" fill="#DCE5F2" font-family="Inter,Segoe UI,sans-serif">Sees every region.</text><text x="294" y="262" font-size="10.5" fill="#DCE5F2" font-family="Inter,Segoe UI,sans-serif">No table filter applied.</text><rect x="294" y="282" width="212" height="30" rx="6" fill="#1B2C55"/><text x="304" y="301" font-size="9.5" fill="#16B8C4" font-weight="600" font-family="Inter,Segoe UI,sans-serif">No filter</text><rect x="544" y="200" width="240" height="130" rx="10" fill="#16254A" fill-opacity="1" stroke="rgba(255,255,255,.08)"/><text x="558" y="222" font-size="11" fill="#9FB0CE" font-weight="600" font-family="Inter,Segoe UI,sans-serif">Role: Analyst</text><text x="558" y="244" font-size="10.5" fill="#DCE5F2" font-family="Inter,Segoe UI,sans-serif">Sees sales but not cost</text><text x="558" y="262" font-size="10.5" fill="#DCE5F2" font-family="Inter,Segoe UI,sans-serif">columns (object-level security).</text><rect x="558" y="282" width="212" height="30" rx="6" fill="#1B2C55"/><text x="568" y="301" font-size="9.5" fill="#16B8C4" font-weight="600" font-family="Inter,Segoe UI,sans-serif">Cost columns hidden</text><rect x="16" y="346" width="768" height="142" rx="10" fill="#16254A" fill-opacity="1" stroke="rgba(255,255,255,.08)"/><text x="30" y="368" font-size="11" fill="#9FB0CE" font-weight="600" font-family="Inter,Segoe UI,sans-serif">Test as role</text><text x="34" y="390" font-size="9.5" fill="#9FB0CE" font-weight="600" font-family="Inter,Segoe UI,sans-serif">Role</text><text x="334" y="390" font-size="9.5" fill="#9FB0CE" font-weight="600" font-family="Inter,Segoe UI,sans-serif">Regions visible</text><text x="594" y="390" font-size="9.5" fill="#9FB0CE" font-weight="600" text-anchor="end" font-family="Inter,Segoe UI,sans-serif">Rows visible</text><text x="766" y="390" font-size="9.5" fill="#9FB0CE" font-weight="600" text-anchor="end" font-family="Inter,Segoe UI,sans-serif">Result</text><line x1="34" x2="766" y1="398" y2="398" stroke="#fff" stroke-opacity=".08"/><text x="34" y="421" font-size="10.5" fill="#fff" font-family="Inter,Segoe UI,sans-serif">Regional Manager</text><text x="334" y="421" font-size="10.5" fill="#DCE5F2" font-family="Inter,Segoe UI,sans-serif">1 of 5</text><text x="594" y="421" font-size="10.5" fill="#DCE5F2" text-anchor="end" font-family="Inter,Segoe UI,sans-serif">About 1 in 5</text><text x="766" y="421" font-size="10.5" fill="#DCE5F2" text-anchor="end" font-family="Inter,Segoe UI,sans-serif">Filtered</text><line x1="34" x2="766" y1="428" y2="428" stroke="#fff" stroke-opacity=".08"/><text x="34" y="451" font-size="10.5" fill="#fff" font-family="Inter,Segoe UI,sans-serif">Executive</text><text x="334" y="451" font-size="10.5" fill="#DCE5F2" font-fa